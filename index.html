<style>
:root {
  --forest: #20241F;
  --ivory:  #F3EFE7;
  --stone:  #B8B2A7;
  --sand:   #CDBDA7;
  --olive:  #737B67;
  --brass:  #A88D62;
  --blue:   #7A93A8;
  --blue-deep: #4A6377;
  --blue-soft: #A8BAC7;
  --text: #2c3129;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans:  'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --max: 1440px;
  --gutter: clamp(20px, 4vw, 64px);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--sans); font-weight: 300;
  background: var(--ivory); color: var(--forest);
  line-height: 1.6; overflow-x: hidden; font-size: 16px;
}
img { display: block; max-width: 100%; height: auto; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
::selection { background: var(--brass); color: var(--ivory); }
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 400; line-height: 1.05; }
.eyebrow { font-family: var(--sans); font-weight: 500; font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--olive); }
.container { max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }
section { position: relative; }

/* HEADER */
.header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 24px 0; transition: padding 0.5s var(--ease), background 0.4s var(--ease); }
.header.scrolled { padding: 14px 0; background: rgba(243, 239, 231, 0.95); border-bottom: 1px solid rgba(32, 36, 31, 0.06); }
.header.hero-over .logo, .header.hero-over .nav a, .header.hero-over .menu-toggle span { color: var(--ivory); }
.header.hero-over .logo svg { color: var(--ivory); }
.header.hero-over .social-link { color: var(--ivory); border-color: rgba(243,239,231,0.4); }
.header.hero-over .social-link:hover { background: var(--ivory); color: var(--forest); border-color: var(--ivory); }
.header.hero-over .btn-nav { color: var(--ivory); }
.header.hero-over .btn-nav:hover { background: var(--ivory); color: var(--forest); border-color: var(--ivory); }
.nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.logo { display: flex; align-items: center; gap: 12px; font-family: var(--serif); font-size: 20px; letter-spacing: 0.32em; font-weight: 500; color: var(--forest); transition: color 0.6s var(--ease); flex-shrink: 0; }
.logo svg { width: 30px; height: 30px; color: var(--forest); transition: color 0.6s var(--ease); flex-shrink: 0; }
.nav { display: flex; gap: 28px; align-items: center; }
.nav a:not(.social-link):not(.btn-nav) { font-size: 13px; font-weight: 400; letter-spacing: 0.06em; color: var(--forest); position: relative; transition: color 0.4s var(--ease); }
.nav a:not(.social-link):not(.btn-nav)::after { content: ''; position: absolute; left: 0; bottom: -6px; height: 1px; width: 0; background: currentColor; transition: width 0.4s var(--ease); }
.nav a:not(.social-link):not(.btn-nav):hover::after { width: 100%; }
.nav a:not(.social-link):not(.btn-nav):hover { color: var(--blue-deep); }
.social-link { width: 38px; height: 38px; border: 1px solid rgba(32,36,31,0.25); border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.4s var(--ease); flex-shrink: 0; color: var(--forest); }
.social-link svg { width: 16px; height: 16px; fill: currentColor; transition: transform 0.4s var(--ease); }
.social-link:hover { background: var(--forest); color: var(--ivory); border-color: var(--forest); }
.social-link:hover svg { transform: scale(1.15); }
.social-group { display: flex; gap: 10px; align-items: center; margin-left: 4px; }
.btn-nav { font-family: var(--sans); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; padding: 12px 22px; border: 1px solid currentColor; transition: all 0.4s var(--ease); color: var(--forest); background: transparent; cursor: pointer; }
.btn-nav:hover { background: var(--forest); color: var(--ivory); border-color: var(--forest); }
.menu-toggle { display: none; width: 32px; height: 20px; position: relative; }
.menu-toggle span { position: absolute; left: 0; width: 100%; height: 1px; background: var(--forest); transition: all 0.4s var(--ease); }
.menu-toggle span:nth-child(1) { top: 6px; }
.menu-toggle span:nth-child(2) { top: 14px; }
.header.hero-over .menu-toggle span { background: var(--ivory); }
.mobile-menu { position: fixed; inset: 0; background: var(--forest); z-index: 200; display: flex; flex-direction: column; padding: 32px var(--gutter); transform: translateY(-100%); transition: transform 0.7s var(--ease); }
.mobile-menu.open { transform: translateY(0); }
.mobile-menu .close { align-self: flex-end; color: var(--ivory); font-size: 28px; font-weight: 200; line-height: 1; }
.mobile-menu nav { margin-top: 60px; display: flex; flex-direction: column; gap: 24px; }
.mobile-menu nav a { color: var(--ivory); font-family: var(--serif); font-size: 30px; font-weight: 400; }
.mobile-menu .mm-social { margin-top: 40px; display: flex; gap: 14px; }
.mobile-menu .mm-social a { width: 48px; height: 48px; border: 1px solid rgba(243,239,231,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.4s var(--ease); }
.mobile-menu .mm-social a svg { width: 20px; height: 20px; fill: var(--ivory); }
.mobile-menu .mm-social a:hover { background: var(--ivory); border-color: var(--ivory); }
.mobile-menu .mm-social a:hover svg { fill: var(--forest); }
.mobile-menu .mm-phone { margin-top: 32px; display: flex; flex-direction: column; gap: 8px; }
.mobile-menu .mm-phone a { color: var(--sand); font-size: 16px; font-weight: 400; letter-spacing: 0.04em; transition: color 0.3s var(--ease); }
.mobile-menu .mm-phone a:hover { color: var(--ivory); }
.mobile-menu .mm-foot { margin-top: auto; color: var(--stone); font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; }

/* HERO */
.hero { height: 100vh; min-height: 640px; position: relative; overflow: hidden; background: var(--forest); }
.hero-bg { position: absolute; inset: 0; background-color: var(--forest); background-image: radial-gradient(circle at 28% 35%, rgba(115,123,103,0.42) 0%, transparent 55%), radial-gradient(circle at 72% 65%, rgba(122,147,168,0.35) 0%, transparent 50%), radial-gradient(circle at 60% 20%, rgba(168,141,98,0.16) 0%, transparent 45%); transform: scale(1.05); animation: heroZoom 22s var(--ease) forwards; }
@keyframes heroZoom { to { transform: scale(1); } }
.hero-bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(32,36,31,0.35) 0%, rgba(32,36,31,0.15) 40%, rgba(32,36,31,0.78) 100%); }
.hero-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.55; }
.hero-lines path { fill: none; stroke: var(--stone); stroke-width: 0.6; stroke-dasharray: 2400; stroke-dashoffset: 2400; animation: drawLine 3s var(--ease) 1s forwards; }
.hero-lines path:nth-child(2) { animation-delay: 1.6s; stroke: var(--blue); opacity: 0.9; stroke-width: 0.8; }
@keyframes drawLine { to { stroke-dashoffset: 0; } }
.hero-content { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: clamp(48px, 8vh, 96px); color: var(--ivory); }
.hero-star { color: var(--brass); font-size: 18px; margin-bottom: 20px; opacity: 0; animation: fadeUp 1.2s var(--ease) 0.3s forwards; }
.hero h1 { font-size: clamp(52px, 11vw, 160px); letter-spacing: 0.02em; font-weight: 400; line-height: 0.95; margin-bottom: 28px; opacity: 0; animation: fadeUp 1.4s var(--ease) 0.5s forwards; }
.hero .tagline { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: clamp(20px, 2.4vw, 32px); max-width: 640px; color: var(--ivory); margin-bottom: 12px; opacity: 0; animation: fadeUp 1.4s var(--ease) 0.7s forwards; }
.hero .sub { font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--sand); margin-bottom: 40px; opacity: 0; animation: fadeUp 1.4s var(--ease) 0.9s forwards; }
.hero-actions { display: flex; gap: 20px; flex-wrap: wrap; opacity: 0; animation: fadeUp 1.4s var(--ease) 1.1s forwards; }
.hero-foot { position: absolute; bottom: 28px; left: 0; right: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; color: var(--stone); font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; padding: 0 var(--gutter); opacity: 0; animation: fadeUp 1.4s var(--ease) 1.4s forwards; }
.hero-foot .scroll-line { display: inline-block; width: 40px; height: 1px; background: var(--stone); vertical-align: middle; margin-left: 12px; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

/* BUTTONS */
.btn { display: inline-flex; align-items: center; gap: 14px; font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; padding: 20px 34px; background: var(--forest); color: var(--ivory); border: 1px solid var(--forest); transition: all 0.5s var(--ease); cursor: pointer; }
.btn:hover { background: var(--olive); border-color: var(--olive); }
.btn .arrow { transition: transform 0.5s var(--ease); }
.btn:hover .arrow { transform: translateX(6px); }
.btn-ghost { background: transparent; color: var(--ivory); border-color: rgba(243,239,231,0.4); }
.btn-ghost:hover { background: var(--ivory); color: var(--forest); border-color: var(--ivory); }
.btn-light { background: var(--ivory); color: var(--forest); border-color: var(--ivory); }
.btn-light:hover { background: var(--sand); border-color: var(--sand); color: var(--forest); }

/* STORY LINE */
.story-line { display: block; width: 100%; height: 60px; overflow: visible; }
.story-line path { fill: none; stroke: var(--stone); stroke-width: 1; stroke-dasharray: 2000; stroke-dashoffset: 2000; transition: stroke-dashoffset 2.4s var(--ease); }
.story-line.in-view path { stroke-dashoffset: 0; }
.story-line.blue path { stroke: var(--blue); opacity: 0.7; }

/* WHO WE ARE */
.who { padding: clamp(64px, 9vw, 120px) 0; background: var(--ivory); }
.who-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: clamp(32px, 6vw, 96px); align-items: center; }
.who-img { aspect-ratio: 4/5; background: var(--forest); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.who-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; z-index: 1; }
.who-text h2 { font-size: clamp(32px, 4vw, 56px); margin-bottom: 24px; }
.who-text h2 em { font-style: italic; color: var(--olive); }
.who-text p { font-size: 16px; color: var(--text); margin-bottom: 18px; max-width: 52ch; line-height: 1.65; }
.who-signature { margin-top: 32px; font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--olive); }

/* SECTION HEAD */
.section-head { margin-bottom: clamp(36px, 5vw, 64px); max-width: 900px; }
.section-head h2 { font-size: clamp(32px, 4.6vw, 68px); margin-top: 16px; }
.section-head h2 em { font-style: italic; color: var(--blue-deep); }
.section-head .eyebrow::before { content: ''; display: inline-block; width: 24px; height: 1px; background: var(--blue); vertical-align: middle; margin-right: 12px; }

/* DIRECTIONS */
.directions { padding: clamp(40px, 6vw, 80px) 0 clamp(64px, 9vw, 120px); background: var(--ivory); }
.dir-accordion { display: flex; flex-direction: column; gap: 0; border-top: 1px solid rgba(32,36,31,0.15); }
.dir-item { border-bottom: 1px solid rgba(32,36,31,0.15); transition: background 0.6s var(--ease); position: relative; }
.dir-item.open { background: rgba(168,186,199,0.08); }
.dir-trigger { display: grid; grid-template-columns: 60px 1fr auto; align-items: center; gap: clamp(16px, 3vw, 40px); width: 100%; text-align: left; padding: clamp(22px, 2.6vw, 34px) clamp(16px, 2vw, 32px); transition: padding 0.4s var(--ease); cursor: pointer; }
.dir-trigger:hover { padding-left: clamp(24px, 3vw, 48px); }
.dir-num { font-family: var(--serif); font-style: italic; font-size: clamp(20px, 1.6vw, 26px); color: var(--blue-deep); line-height: 1; }
.dir-title { font-family: var(--serif); font-size: clamp(28px, 3.6vw, 52px); font-weight: 400; color: var(--forest); line-height: 1.1; }
.dir-title em { font-style: italic; color: var(--olive); }
.dir-toggle { width: 44px; height: 44px; border: 1px solid rgba(32,36,31,0.25); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 200; color: var(--forest); transition: all 0.5s var(--ease); flex-shrink: 0; }
.dir-item.open .dir-toggle { transform: rotate(45deg); background: var(--blue-deep); color: var(--ivory); border-color: var(--blue-deep); }
.dir-content { max-height: 0; overflow: hidden; transition: max-height 0.9s var(--ease), padding 0.9s var(--ease); }
.dir-item.open .dir-content { max-height: 2600px; padding: 0 clamp(16px, 2vw, 32px) clamp(28px, 3.5vw, 44px); }
.dir-content-inner { padding-left: clamp(0px, 6vw, 100px); }
.dir-lead { font-family: var(--serif); font-style: italic; font-size: clamp(18px, 1.6vw, 22px); color: var(--blue-deep); line-height: 1.5; margin-bottom: 18px; max-width: 72ch; padding-left: 20px; border-left: 3px solid var(--blue); }
.dir-desc p { font-size: 17px; color: var(--text); line-height: 1.75; margin-bottom: 14px; max-width: 72ch; }
.dir-desc p:first-of-type { font-size: 18px; color: var(--forest); }
.dir-features { list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 22px; margin-top: 22px; padding-top: 18px; border-top: 1px solid rgba(32,36,31,0.12); }
.dir-features li { font-size: 14px; color: var(--forest); padding-left: 18px; position: relative; font-weight: 400; }
.dir-features li::before { content: '✦'; position: absolute; left: 0; color: var(--blue); font-size: 9px; top: 5px; }

/* FORMATS */
.dir-formats { margin-top: 40px; position: relative; }
.dir-formats::before { content: ''; position: absolute; top: -22px; left: 0; right: 0; height: 1px; background: linear-gradient(to right, transparent 0%, rgba(122,147,168,0.6) 15%, rgba(122,147,168,0.6) 85%, transparent 100%); }
.dir-subhead { display: flex; align-items: baseline; gap: 16px; margin-bottom: 22px; position: relative; }
.dir-subhead .sh-num { font-family: var(--serif); font-style: italic; font-size: 32px; color: var(--blue-deep); line-height: 1; font-weight: 400; }
.dir-subhead .sh-title { font-family: var(--sans); font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--forest); font-weight: 600; }
.dir-subhead .sh-line { flex: 1; height: 1px; background: linear-gradient(to right, rgba(122,147,168,0.5), transparent); align-self: center; }
.dir-formats-grid { display: flex; flex-direction: column; gap: 0; border-top: 1px solid rgba(32,36,31,0.12); }
.dir-format { display: grid; grid-template-columns: 110px 1fr; gap: 32px; align-items: center; padding: 28px 24px; background: var(--ivory); border-bottom: 1px solid rgba(32,36,31,0.12); position: relative; transition: all 0.5s var(--ease); }
.dir-format::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--blue); transform: scaleY(0); transform-origin: top; transition: transform 0.5s var(--ease); }
.dir-format:nth-child(2)::after { background: var(--brass); }
.dir-format:nth-child(3)::after { background: var(--olive); }
.dir-format:hover { background: rgba(168,186,199,0.1); padding-left: 32px; }
.dir-format:hover::after { transform: scaleY(1); }
.dir-format .df-icon-wrap { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.dir-format .df-icon { width: 44px; height: 44px; }
.dir-format .df-num { font-family: var(--serif); font-style: italic; font-size: 13px; letter-spacing: 0.14em; color: var(--blue-deep); font-weight: 500; }
.dir-format:nth-child(2) .df-num { color: var(--brass); }
.dir-format:nth-child(3) .df-num { color: var(--olive); }
.dir-format .df-text h4 { font-family: var(--serif); font-size: 26px; font-weight: 400; margin-bottom: 8px; color: var(--forest); }
.dir-format .df-text p { font-size: 15px; color: var(--text); line-height: 1.65; max-width: 68ch; }

/* LEVELS */
.dir-levels { margin-top: 40px; padding-top: 24px; position: relative; }
.dir-levels::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(to right, transparent 0%, rgba(115,123,103,0.5) 15%, rgba(115,123,103,0.5) 85%, transparent 100%); }
.dir-levels-scale { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin-top: 20px; position: relative; }
.dir-levels-scale::before { content: ''; position: absolute; top: 12px; left: 16.66%; right: 16.66%; height: 1px; background: linear-gradient(to right, var(--blue), var(--olive), var(--brass)); opacity: 0.5; }
.dir-level { padding: 0 12px; text-align: center; position: relative; }
.dir-level .dl-marker { width: 24px; height: 24px; border-radius: 50%; background: var(--ivory); border: 2px solid var(--blue); margin: 0 auto 20px; position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; }
.dir-level .dl-marker::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); }
.dir-level:nth-child(2) .dl-marker { border-color: var(--olive); }
.dir-level:nth-child(2) .dl-marker::after { background: var(--olive); width: 14px; height: 14px; }
.dir-level:nth-child(3) .dl-marker { border-color: var(--brass); }
.dir-level:nth-child(3) .dl-marker::after { background: var(--brass); width: 18px; height: 18px; }
.dir-level .dl-name { font-family: var(--serif); font-style: italic; font-size: 22px; color: var(--forest); display: block; margin-bottom: 8px; }
.dir-level .dl-desc { font-size: 13.5px; color: var(--text); line-height: 1.55; max-width: 28ch; margin: 0 auto; }

/* GALLERY */
.dir-gallery { display: grid; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; margin-top: 40px; position: relative; aspect-ratio: 16/7; }
.dir-gallery .dg-item { background: var(--forest); position: relative; overflow: hidden; transition: transform 0.6s var(--ease); }
.dir-gallery .dg-item:nth-child(1) { grid-row: 1 / 3; grid-column: 1; }
.dir-gallery .dg-item:nth-child(2) { grid-column: 2; grid-row: 1; }
.dir-gallery .dg-item:nth-child(3) { grid-column: 3; grid-row: 1; }
.dir-gallery .dg-item:nth-child(4) { grid-column: 2; grid-row: 2; }
.dir-gallery .dg-item:nth-child(5) { grid-column: 3; grid-row: 2; }
.dir-gallery .dg-item::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 30% 30%, rgba(115,123,103,0.45) 0%, transparent 60%), radial-gradient(circle at 70% 70%, rgba(122,147,168,0.4) 0%, transparent 55%); z-index: 0; }
.dir-gallery .dg-item:has(img)::before, .dir-gallery .dg-item:has(video)::before { opacity: 0; }
.dir-gallery .dg-item:hover { transform: scale(1.015); }
.dir-gallery .dg-item img, .dir-gallery .dg-item video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; z-index: 1; }

/* PROJECTS */
.projects { padding: clamp(64px, 9vw, 120px) 0; background: var(--ivory); border-top: 1px solid rgba(32,36,31,0.08); }
.proj-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: clamp(20px, 2.4vw, 40px); }
.proj-item { display: block; position: relative; background: var(--ivory); border: 1px solid rgba(32,36,31,0.12); transition: all 0.5s var(--ease); }
.proj-item:hover { border-color: var(--blue); box-shadow: 0 20px 40px -24px rgba(32,36,31,0.15); }
.proj-thumb { aspect-ratio: 4/3; background: var(--forest); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--ivory); }
.proj-thumb::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 30% 30%, rgba(115,123,103,0.35) 0%, transparent 60%), radial-gradient(circle at 72% 68%, rgba(122,147,168,0.3) 0%, transparent 55%); z-index: 0; }
.proj-thumb:has(img)::before { opacity: 0; }
.proj-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; z-index: 1; }
.proj-thumb .thumb-num { position: absolute; top: 22px; left: 24px; font-size: 10px; letter-spacing: 0.24em; color: var(--blue-soft); z-index: 2; text-shadow: 0 1px 4px rgba(0,0,0,0.4); }
.proj-body { padding: 28px 30px 32px; }
.proj-body h4 { font-family: var(--serif); font-size: 26px; margin-bottom: 8px; font-weight: 400; }
.proj-body .p-info { font-size: 12px; letter-spacing: 0.08em; color: var(--stone); margin-bottom: 16px; }
.proj-body .p-desc { font-size: 14px; color: var(--text); line-height: 1.6; }
.proj-status { position: absolute; top: 22px; right: 22px; z-index: 2; font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; padding: 6px 12px; background: rgba(243,239,231,0.95); color: var(--forest); }
.proj-status.diploma { background: rgba(168,141,98,0.95); color: var(--ivory); }
.proj-link-btn { display: inline-flex; align-items: center; gap: 10px; margin-top: 18px; padding: 12px 22px; font-family: var(--sans); font-size: 11px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--forest); background: transparent; border: 1px solid var(--forest); transition: all 0.4s var(--ease); text-decoration: none; }
.proj-link-btn:hover { background: var(--forest); color: var(--ivory); }
.proj-link-btn .arrow { transition: transform 0.4s var(--ease); }
.proj-link-btn:hover .arrow { transform: translateX(6px); }

/* PERSONAL STORY */
.personal-story { padding: clamp(64px, 9vw, 120px) 0; background: var(--forest); color: var(--ivory); overflow: hidden; position: relative; }
.ps-inner { display: grid; grid-template-columns: 1fr 1.3fr; gap: clamp(32px, 6vw, 96px); align-items: start; position: relative; z-index: 2; }
.ps-left .eyebrow { color: var(--brass); }
.ps-left h2 { font-size: clamp(30px, 4vw, 52px); margin: 16px 0 24px; }
.ps-left h2 em { font-style: italic; color: var(--sand); }
.ps-left p { font-size: 15px; color: var(--sand); line-height: 1.65; max-width: 42ch; }
.ps-chain { display: flex; flex-direction: column; gap: 0; }
.ps-step { display: flex; align-items: flex-start; gap: 24px; padding: 22px 0; border-bottom: 1px solid rgba(184,178,167,0.15); }
.ps-step:first-child { border-top: 1px solid rgba(184,178,167,0.15); }
.ps-step .ps-num { font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--brass); min-width: 40px; }
.ps-step .ps-content h4 { font-family: var(--serif); font-size: 20px; font-weight: 400; margin-bottom: 6px; color: var(--ivory); }
.ps-step .ps-content p { font-size: 13px; color: var(--stone); line-height: 1.55; }
.ps-step:nth-child(3) .ps-num, .ps-step:nth-child(4) .ps-num { color: var(--blue); }
.ps-cta { margin-top: 40px; }

/* PROCESS */
.process { padding: clamp(56px, 8vw, 100px) 0; background: var(--ivory); border-top: 1px solid rgba(32,36,31,0.08); }
.process-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 1px solid rgba(32,36,31,0.15); }
.step { padding: 32px 24px 32px 0; border-right: 1px solid rgba(32,36,31,0.1); transition: background 0.5s var(--ease); }
.step:last-child { border-right: none; }
.step:nth-child(2n) { padding-left: 24px; }
.step:nth-child(3n) { padding-left: 24px; }
.step:nth-child(4n) { padding-left: 24px; }
.step:hover { background: rgba(168,186,199,0.15); }
.step .num { font-family: var(--serif); font-size: 32px; color: var(--blue-deep); margin-bottom: 18px; display: block; font-style: italic; line-height: 1; }
.step h3 { margin-bottom: 10px; font-family: var(--sans); font-weight: 500; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; }
.step p { font-size: 14px; color: var(--text); line-height: 1.55; }

/* SERVICES */
.services { padding: clamp(64px, 9vw, 120px) 0; background: var(--ivory); border-top: 1px solid rgba(32,36,31,0.08); }
.services-intro { max-width: 720px; margin-bottom: clamp(40px, 5vw, 64px); }
.services-intro h2 { font-size: clamp(32px, 4.6vw, 68px); margin: 16px 0 20px; }
.services-intro h2 em { font-style: italic; color: var(--blue-deep); }
.services-intro p { font-size: 16px; color: var(--text); }
.service-block { display: grid; grid-template-columns: 1fr 2fr; gap: clamp(28px, 4vw, 64px); padding: clamp(32px, 4vw, 56px) 0; border-top: 1px solid rgba(32,36,31,0.12); }
.service-block:last-of-type { border-bottom: 1px solid rgba(32,36,31,0.12); }
.service-block .sb-left { position: sticky; top: 100px; align-self: start; }
.service-block .sb-num { font-size: 11px; letter-spacing: 0.28em; color: var(--blue-deep); margin-bottom: 14px; font-weight: 500; }
.service-block h3 { font-family: var(--serif); font-size: clamp(26px, 2.8vw, 38px); margin-bottom: 14px; }
.service-block h3 em { font-style: italic; color: var(--olive); }
.service-block .sb-tag { font-family: var(--serif); font-size: 17px; color: var(--forest); margin-bottom: 18px; font-style: italic; }
.service-block .sb-list { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 28px; }
.service-block .sb-list li { font-size: 14px; color: var(--text); padding-left: 20px; position: relative; line-height: 1.55; }
.service-block .sb-list li::before { content: '✦'; position: absolute; left: 0; color: var(--blue); font-size: 9px; top: 5px; }
.service-block .sb-note { font-size: 14px; color: var(--forest); font-style: italic; margin-top: 22px; padding: 14px 20px; background: rgba(168,186,199,0.16); border-left: 3px solid var(--blue); max-width: 60ch; line-height: 1.55; }

/* QUESTIONNAIRE */
.questionnaire { padding: clamp(64px, 9vw, 120px) 0; background: var(--forest); color: var(--ivory); position: relative; overflow: hidden; }
.q-container { display: grid; grid-template-columns: 1fr 1.2fr; gap: clamp(40px, 6vw, 96px); align-items: center; position: relative; z-index: 2; }
.q-side .eyebrow { color: var(--brass); }
.q-side h2 { font-size: clamp(32px, 4vw, 56px); margin: 16px 0 24px; }
.q-side h2 em { font-style: italic; color: var(--sand); }
.q-side > p { font-size: 15px; color: var(--sand); line-height: 1.65; max-width: 40ch; margin-bottom: 40px; }
.q-form-wrap { background: rgba(243,239,231,0.03); border: 1px solid rgba(184,178,167,0.15); padding: clamp(32px, 4vw, 56px); text-align: left; }
.q-form-wrap .q-cta-title { font-family: var(--serif); font-size: clamp(26px, 3vw, 40px); color: var(--ivory); margin-bottom: 20px; line-height: 1.15; }
.q-form-wrap .q-cta-title em { font-style: italic; color: var(--sand); }
.q-form-wrap .q-cta-text { font-size: 15px; color: var(--sand); line-height: 1.7; margin-bottom: 28px; max-width: 52ch; }
.q-form-wrap .q-cta-note { font-size: 12px; color: var(--stone); font-style: italic; margin-top: 20px; line-height: 1.5; }
.q-form-wrap .q-cta-note a { color: var(--sand); border-bottom: 1px solid rgba(205,189,167,0.4); }
.q-form-wrap .q-cta-note a:hover { border-color: var(--sand); }

/* CONSENT CHECKBOX */
.q-consent { margin-bottom: 24px; }
.q-consent-label { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; font-size: 13px; line-height: 1.55; color: var(--stone); }
.q-consent-label input { position: absolute; opacity: 0; pointer-events: none; }
.q-consent-check { flex-shrink: 0; width: 20px; height: 20px; border: 1px solid rgba(184,178,167,0.5); margin-top: 1px; position: relative; transition: all 0.3s var(--ease); background: transparent; }
.q-consent-label input:checked + .q-consent-check { background: var(--brass); border-color: var(--brass); }
.q-consent-label input:checked + .q-consent-check::after { content: ''; position: absolute; left: 6px; top: 2px; width: 6px; height: 11px; border: solid var(--forest); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.q-consent-label:hover .q-consent-check { border-color: var(--brass); }
.q-consent-text a { color: var(--sand); border-bottom: 1px solid rgba(205,189,167,0.4); }
.q-consent-text a:hover { border-color: var(--sand); }
.q-go-disabled { opacity: 0.45; pointer-events: none; cursor: not-allowed; }

/* FINAL CTA */
.final-cta { background: var(--ivory); color: var(--forest); padding: clamp(80px, 11vw, 140px) 0 clamp(56px, 7vw, 88px); text-align: center; }
.final-cta .fstar { color: var(--brass); font-size: 28px; margin-bottom: 28px; display: inline-block; }
.final-cta h2 { font-size: clamp(36px, 5.4vw, 80px); line-height: 1.05; max-width: 18ch; margin: 0 auto 40px; }
.final-cta h2 em { font-style: italic; color: var(--blue-deep); }

/* FOOTER */
.footer { background: var(--forest); color: var(--stone); padding: 64px 0 32px; font-size: 14px; }
.foot-top { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; padding-bottom: 40px; border-bottom: 1px solid rgba(184,178,167,0.12); margin-bottom: 40px; }
.foot-cta { display: inline-flex; align-items: center; font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ivory); background: var(--blue-deep); padding: 16px 28px; border: 1px solid var(--blue-deep); transition: all 0.4s var(--ease); cursor: pointer; }
.foot-cta:hover { background: var(--brass); border-color: var(--brass); }
.foot-up { display: inline-flex; align-items: center; gap: 10px; font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ivory); padding: 15px 22px; border: 1px solid rgba(184,178,167,0.35); background: transparent; transition: all 0.4s var(--ease); cursor: pointer; }
.foot-up:hover { border-color: var(--ivory); background: rgba(243,239,231,0.08); }
.foot-up-arrow { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--brass); color: var(--forest); font-size: 14px; font-weight: 700; transition: transform 0.4s var(--ease); }
.foot-up:hover .foot-up-arrow { transform: translateY(-3px); }
.foot-nav { display: flex; gap: 32px; margin-left: auto; flex-wrap: wrap; }
.foot-nav a { font-size: 14px; color: var(--stone); transition: color 0.3s var(--ease); }
.foot-nav a:hover { color: var(--ivory); }
.foot-contacts { display: flex; gap: 32px; flex-wrap: wrap; align-items: center; padding-bottom: 32px; border-bottom: 1px solid rgba(184,178,167,0.12); margin-bottom: 32px; }
.foot-contact-item { display: inline-flex; align-items: center; gap: 12px; font-size: 15px; color: var(--ivory); transition: color 0.3s var(--ease); }
.foot-contact-item:hover { color: var(--brass); }
.foot-contact-icon { width: 20px; height: 20px; color: var(--brass); flex-shrink: 0; }
.foot-middle { display: flex; gap: 40px; align-items: center; flex-wrap: wrap; padding-bottom: 32px; border-bottom: 1px solid rgba(184,178,167,0.12); margin-bottom: 32px; }
.foot-socials { display: flex; gap: 12px; }
.foot-socials a { width: 40px; height: 40px; border: 1px solid rgba(184,178,167,0.25); border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.4s var(--ease); }
.foot-socials a svg { width: 16px; height: 16px; fill: var(--stone); transition: fill 0.4s var(--ease); }
.foot-socials a:hover { border-color: var(--brass); background: var(--brass); }
.foot-socials a:hover svg { fill: var(--forest); }
.foot-service { display: flex; gap: 28px; flex-wrap: wrap; margin-left: auto; }
.foot-service a { font-size: 13px; color: var(--stone); transition: color 0.3s var(--ease); }
.foot-service a:hover { color: var(--ivory); }
.foot-bottom-new { display: flex; flex-direction: column; gap: 16px; text-align: center; font-size: 12px; color: rgba(184,178,167,0.55); line-height: 1.6; }
.foot-copy { color: var(--stone); font-size: 13px; letter-spacing: 0.04em; }
.foot-meta { max-width: 720px; margin: 0 auto; font-size: 11px; font-style: italic; color: rgba(184,178,167,0.5); line-height: 1.5; }
.foot-requisites { font-size: 12px; color: rgba(184,178,167,0.6); letter-spacing: 0.04em; margin-bottom: 12px; }
.foot-legal { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; align-items: center; }
.foot-legal a { color: var(--stone); text-decoration: underline; text-underline-offset: 3px; transition: color 0.3s var(--ease); }
.foot-legal a:hover { color: var(--ivory); }

/* COOKIE BANNER */
.cookie-banner { position: fixed; left: 0; right: 0; bottom: 0; z-index: 300; background: rgba(32, 36, 31, 0.98); color: var(--ivory); border-top: 1px solid rgba(184, 178, 167, 0.2); transform: translateY(100%); transition: transform 0.6s var(--ease); padding: clamp(20px, 3vw, 28px) 0; box-shadow: 0 -8px 40px -12px rgba(0, 0, 0, 0.3); }
.cookie-banner.show { transform: translateY(0); }
.cookie-banner-inner { max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); display: flex; align-items: center; gap: clamp(20px, 3vw, 40px); flex-wrap: wrap; }
.cookie-text { font-size: 13px; line-height: 1.6; color: var(--stone); flex: 1; min-width: 260px; margin: 0; }
.cookie-text a { color: var(--sand); border-bottom: 1px solid rgba(205, 189, 167, 0.4); }
.cookie-text a:hover { border-color: var(--sand); }
.cookie-actions { display: flex; gap: 12px; flex-shrink: 0; }
.cookie-btn { font-family: var(--sans); font-size: 11px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; padding: 12px 22px; border: 1px solid; transition: all 0.4s var(--ease); cursor: pointer; white-space: nowrap; }
.cookie-btn-accept { background: var(--brass); color: var(--forest); border-color: var(--brass); }
.cookie-btn-accept:hover { background: var(--sand); border-color: var(--sand); }
.cookie-btn-decline { background: transparent; color: var(--stone); border-color: rgba(184, 178, 167, 0.4); }
.cookie-btn-decline:hover { color: var(--ivory); border-color: var(--ivory); }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(32, 36, 31, 0.85); z-index: 400; display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.4s var(--ease); overflow-y: auto; }
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal { background: var(--ivory); width: 100%; max-width: 480px; padding: clamp(28px, 4vw, 44px); position: relative; transform: translateY(20px); transition: transform 0.4s var(--ease); margin: auto; }
.modal-overlay.open .modal { transform: translateY(0); }
.modal-close { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 200; color: var(--forest); transition: transform 0.3s var(--ease), color 0.3s var(--ease); cursor: pointer; background: transparent; border: none; }
.modal-close:hover { transform: rotate(90deg); color: var(--brass); }
.modal h3 { font-family: var(--serif); font-size: clamp(24px, 3vw, 32px); color: var(--forest); margin-bottom: 8px; line-height: 1.15; padding-right: 40px; }
.modal-sub { font-size: 14px; color: var(--text); line-height: 1.6; margin-bottom: 28px; max-width: 44ch; }
.modal-form { display: flex; flex-direction: column; gap: 18px; }
.modal-field { display: flex; flex-direction: column; gap: 6px; }
.modal-field label { font-family: var(--sans); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--olive); }
.modal-field input { font-family: var(--sans); font-size: 15px; padding: 12px 0; background: transparent; border: none; border-bottom: 1px solid rgba(32, 36, 31, 0.25); color: var(--forest); transition: border-color 0.3s var(--ease); }
.modal-field input:focus { outline: none; border-color: var(--brass); }
.modal-field input::placeholder { color: var(--stone); }
.modal-consent { display: flex; align-items: flex-start; gap: 10px; font-size: 12px; line-height: 1.5; color: var(--text); cursor: pointer; margin-top: 4px; }
.modal-consent input { position: absolute; opacity: 0; pointer-events: none; }
.modal-check { flex-shrink: 0; width: 18px; height: 18px; border: 1px solid rgba(32, 36, 31, 0.4); margin-top: 1px; position: relative; transition: all 0.3s var(--ease); background: transparent; }
.modal-consent input:checked + .modal-check { background: var(--brass); border-color: var(--brass); }
.modal-consent input:checked + .modal-check::after { content: ''; position: absolute; left: 5px; top: 1px; width: 6px; height: 11px; border: solid var(--forest); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.modal-consent a { color: var(--blue-deep); border-bottom: 1px solid rgba(74, 99, 119, 0.3); }
.modal-consent a:hover { border-color: var(--blue-deep); }
.modal-submit { display: inline-flex; align-items: center; justify-content: center; gap: 12px; font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; padding: 18px 28px; background: var(--forest); color: var(--ivory); border: 1px solid var(--forest); transition: all 0.4s var(--ease); cursor: pointer; margin-top: 8px; width: 100%; }
.modal-submit:hover { background: var(--olive); border-color: var(--olive); }
.modal-submit:disabled { opacity: 0.5; cursor: not-allowed; }
.modal-submit .arrow { transition: transform 0.4s var(--ease); }
.modal-submit:hover .arrow { transform: translateX(6px); }
.modal-message { display: none; padding: 20px; border-left: 3px solid var(--brass); background: rgba(168, 141, 98, 0.1); font-size: 14px; color: var(--forest); line-height: 1.6; }
.modal-message.success { display: block; }
.modal-message.error { display: block; border-left-color: #b94a4a; background: rgba(185, 74, 74, 0.08); }

/* REVEAL */
.reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.9s var(--ease), transform 0.9s var(--ease); }
.reveal.in-view { opacity: 1; transform: translateY(0); }
.reveal.delay-1 { transition-delay: 0.08s; }
.reveal.delay-2 { transition-delay: 0.16s; }
.reveal.delay-3 { transition-delay: 0.24s; }

/* RESPONSIVE */
@media (max-width: 1100px) { .social-group { display: none; } }
@media (max-width: 1024px) {
  .who-grid, .ps-inner { grid-template-columns: 1fr; }
  .who-img { aspect-ratio: 16/10; }
  .proj-grid { grid-template-columns: 1fr 1fr; }
  .process-grid { grid-template-columns: 1fr 1fr; }
  .step { border-right: none; border-bottom: 1px solid rgba(32,36,31,0.1); padding: 28px 0; }
  .step:nth-child(2n), .step:nth-child(3n), .step:nth-child(4n) { padding-left: 0; }
  .service-block { grid-template-columns: 1fr; gap: 20px; }
  .service-block .sb-left { position: static; }
  .q-container { grid-template-columns: 1fr; gap: 40px; }
  .dir-content-inner { padding-left: 0; }
  .dir-features { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 720px) {
  .nav { display: none; }
  .menu-toggle { display: block; }
  .header { padding: 18px 0; }
  .hero-foot { font-size: 9px; letter-spacing: 0.2em; }
  .hero-foot .scroll-line { width: 24px; }
  .hero-actions .btn { padding: 16px 24px; font-size: 11px; }
  .proj-grid { grid-template-columns: 1fr; }
  .process-grid { grid-template-columns: 1fr; }
  .service-block .sb-list { grid-template-columns: 1fr; }
  .who { padding: 56px 0; }
  .who-img { aspect-ratio: 4/3; }
  .who-text h2 { font-size: 30px; line-height: 1.15; margin-bottom: 20px; }
  .who-text p { font-size: 15.5px; line-height: 1.7; margin-bottom: 16px; }
  .dir-trigger { grid-template-columns: 32px 1fr auto; gap: 12px; padding: 20px 10px; }
  .dir-title { font-size: 24px; line-height: 1.15; }
  .dir-format { grid-template-columns: 72px 1fr; gap: 16px; padding: 22px 16px; align-items: center; }
  .dir-format .df-icon { width: 52px; height: 52px; }
  .dir-format .df-text h4 { font-size: 21px; }
  .dir-format .df-text p { font-size: 14.5px; }
  .dir-levels-scale { grid-template-columns: repeat(3, 1fr); }
  .dir-gallery { grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto; aspect-ratio: auto; }
  .dir-gallery .dg-item:nth-child(1) { grid-column: 1 / 3; grid-row: 1; aspect-ratio: 4/3; }
  .dir-gallery .dg-item:nth-child(2) { grid-column: 1; grid-row: 2; aspect-ratio: 1; }
  .dir-gallery .dg-item:nth-child(3) { grid-column: 2; grid-row: 2; aspect-ratio: 1; }
  .dir-gallery .dg-item:nth-child(4) { grid-column: 1; grid-row: 3; aspect-ratio: 1; }
  .dir-gallery .dg-item:nth-child(5) { grid-column: 2; grid-row: 3; aspect-ratio: 1; }
  .projects { padding: 56px 0; }
  .proj-body { padding: 22px 22px 26px; }
  .proj-body h4 { font-size: 22px; }
  .personal-story { padding: 56px 0; }
  .ps-left h2 { font-size: 30px; line-height: 1.15; }
  .process { padding: 56px 0; }
  .services { padding: 56px 0; }
  .services-intro h2 { font-size: 30px; }
  .service-block { padding: 32px 0; gap: 16px; }
  .questionnaire { padding: 56px 0; }
  .q-side h2 { font-size: 30px; }
  .q-form-wrap { padding: 28px 22px; }
  .final-cta { padding: 64px 0 56px; }
  .final-cta h2 { font-size: 32px; }
  .footer { padding: 48px 0 24px; }
  .foot-top { flex-direction: column; align-items: stretch; gap: 16px; }
